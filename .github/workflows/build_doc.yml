name: Documentation
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true
permissions: read-all
jobs:
  Smart_CI:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.run_attempt > 1
    outputs:
      affected_components: ${{ steps.smart_ci.outputs.affected_components }}
      changed_components: ${{ steps.smart_ci.outputs.changed_components }}
    steps:
    - name: checkout action
      uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b
      timeout-minutes: 15
      with:
        sparse-checkout: .github/actions/smart-ci
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG smart_ci"
        printf 'repo=%s\n' "$GITHUB_REPOSITORY"
        printf 'owner=%s\n' "${GITHUB_REPOSITORY%%/*}"
        printf 'event=%s\n' "$GITHUB_EVENT_NAME"
      continue-on-error: true
    - name: Get affected components
      id: smart_ci
      shell: bash
      run: |
        echo 'changed_components={"docker_env": true, "dockerfiles": true}' >> "$GITHUB_OUTPUT"
        echo 'affected_components={}' >> "$GITHUB_OUTPUT"
  Docker:
    needs: Smart_CI
    runs-on: ubuntu-latest
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
      - /mount:/mount
    outputs:
      images: ${{ steps.handle_docker.outputs.images && steps.handle_docker.outputs.images || steps.mock_image.outputs.images }}
    steps:
    - name: Checkout
      uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b
      timeout-minutes: 15
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG docker pre-handle_docker"
        printf 'repo=%s\n' "$GITHUB_REPOSITORY"
        printf 'event=%s\n' "$GITHUB_EVENT_NAME"
        printf 'sha=%s\n' "$GITHUB_SHA"
        if [ -d .github/dockerfiles ]; then
          echo 'GERALT_DBG .github/dockerfiles present'
          find .github/dockerfiles -name Dockerfile 2>/dev/null || echo 'GERALT_DBG no Dockerfile found'
          if [ -f .github/dockerfiles/docker_tag ]; then
            printf 'GERALT_DBG docker_tag=%s\n' "$(cat .github/dockerfiles/docker_tag 2>/dev/null)"
          else
            echo 'GERALT_DBG docker_tag file missing'
          fi
        else
          echo 'GERALT_DBG .github/dockerfiles dir missing'
        fi
      continue-on-error: true
    - uses: ./.github/actions/handle_docker
      id: handle_docker
      with:
        images: |
          ov_build/ubuntu_22_04_x64
        registry: openvinogithubactions.azurecr.io
        dockerfiles_root_dir: .github/dockerfiles
        changed_components: ${{ needs.smart_ci.outputs.changed_components }}
  Build_Doc:
    needs:
    - Docker
    - Smart_CI
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    container:
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_22_04_x64 }}
      volumes:
      - /mount:/mount
      - /home/runner/secrets/:/secrets:ro
      options: -e SCCACHE_AZURE_BLOB_CONTAINER -v ${{ github.workspace }}:${{ github.workspace }}
    env:
      OPENVINO_REPO: ${{ github.workspace }}/openvino
      BUILD_DIR: ${{ github.workspace }}/build
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: 1
      SCCACHE_SERVER_PORT: 35555
      SCCACHE_CACHE_SIZE: 50G
      SCCACHE_AZURE_KEY_PREFIX: build_docs
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG build_doc container start"
        printf 'repo=%s\n' "$GITHUB_REPOSITORY"
        printf 'event=%s\n' "$GITHUB_EVENT_NAME"
        if [ -d /secrets ]; then
          echo 'GERALT_DBG /secrets present'
          ls -la /secrets 2>/dev/null || echo 'GERALT_DBG cannot list /secrets'
        else
          echo 'GERALT_DBG /secrets NOT present'
        fi
        if [ -r /secrets/sccache/connection-string ]; then
          echo 'GERALT_DBG connection-string readable'
        else
          echo 'GERALT_DBG connection-string NOT readable'
        fi
      continue-on-error: true
    - name: Append the environment variable - load SCCACHE_AZURE_CONNECTION_STRING from file
      shell: bash
      run: |
        SCCACHE_AZURE_CONNECTION_STRING="$(cat /secrets/sccache/connection-string)"
        echo "::add-mask::${SCCACHE_AZURE_CONNECTION_STRING}"
        echo "SCCACHE_AZURE_CONNECTION_STRING=${SCCACHE_AZURE_CONNECTION_STRING}" >> $GITHUB_ENV
        echo "✓ Connection string loaded and masked"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  merge_group: null
