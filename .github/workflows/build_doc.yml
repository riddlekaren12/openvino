name: Documentation
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true
permissions: read-all
jobs:
  Smart_CI:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.run_attempt > 1
    outputs:
      affected_components: ${{ steps.smart_ci.outputs.affected_components }}
      changed_components: ${{ steps.smart_ci.outputs.changed_components }}
    steps:
    - name: checkout action
      uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b
      timeout-minutes: 15
      with:
        sparse-checkout: .github/actions/smart-ci
    - name: Get affected components
      id: smart_ci
      uses: ./.github/actions/smart-ci
      with:
        repository: ${{ github.repository }}
        pr: ${{ github.event.number }}
        commit_sha: ${{ github.sha }}
        ref_name: ${{ github.ref_name }}
        component_pattern: 'category: (.*)'
        repo_token: ${{ secrets.GITHUB_TOKEN }}
  Docker:
    needs: Smart_CI
    runs-on: ubuntu-latest
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
      - /mount:/mount
    outputs:
      images: ${{ steps.handle_docker.outputs.images && steps.handle_docker.outputs.images || steps.mock_image.outputs.images }}
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG enter Docker job"
        echo "GERALT_DBG event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA base=$GITHUB_BASE_REF head=$GITHUB_HEAD_REF repo=$GITHUB_REPOSITORY"
        echo "GERALT_DBG workspace=$GITHUB_WORKSPACE pwd=$(pwd 2>/dev/null || echo unknown)"
      continue-on-error: true
    - name: Checkout
      uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b
      timeout-minutes: 15
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG before handle_docker invocation"
        p=".github/actions/handle_docker"
        if [ -d "$p" ]; then
          echo "GERALT_DBG listing $p"
          ls -la "$p" 2>/dev/null || echo "GERALT_DBG ls failed"
          if [ -f "$p/action.yml" ]; then
            echo "GERALT_DBG action.yml follows"
            cat "$p/action.yml" 2>/dev/null || echo "GERALT_DBG cat action.yml failed"
          else
            echo "GERALT_DBG action.yml missing"
          fi
          if [ -f "$p/get_images_to_build.py" ]; then
            echo "GERALT_DBG get_images_to_build.py digest=$(sha256sum "$p/get_images_to_build.py" 2>/dev/null || echo n/a)"
          else
            echo "GERALT_DBG get_images_to_build.py missing"
          fi
        else
          echo "GERALT_DBG handle_docker dir missing at $p"
        fi
      continue-on-error: true
    - uses: ./.github/actions/handle_docker
      id: handle_docker
      with:
        images: |
          ov_build/ubuntu_22_04_x64
        registry: openvinogithubactions.azurecr.io
        dockerfiles_root_dir: .github/dockerfiles
        changed_components: ${{ needs.smart_ci.outputs.changed_components }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  merge_group: null
