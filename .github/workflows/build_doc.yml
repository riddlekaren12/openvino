name: Documentation
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true
permissions: read-all
jobs:
  Smart_CI:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.run_attempt > 1
    outputs:
      affected_components: ${{ steps.smart_ci.outputs.affected_components }}
      changed_components: ${{ steps.smart_ci.outputs.changed_components }}
    steps:
    - name: checkout action
      uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b
      timeout-minutes: 15
      with:
        sparse-checkout: .github/actions/smart-ci
    - name: Get affected components
      id: smart_ci
      uses: ./.github/actions/smart-ci
      with:
        repository: ${{ github.repository }}
        pr: ${{ github.event.number }}
        commit_sha: ${{ github.sha }}
        ref_name: ${{ github.ref_name }}
        component_pattern: 'category: (.*)'
        repo_token: ${{ secrets.GITHUB_TOKEN }}
  Docker:
    needs: Smart_CI
    runs-on: ubuntu-latest
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
      - /mount:/mount
    outputs:
      images: ${{ steps.handle_docker.outputs.images && steps.handle_docker.outputs.images || steps.mock_image.outputs.images }}
    steps:
    - name: Checkout
      uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b
      timeout-minutes: 15
    - uses: ./.github/actions/handle_docker
      id: handle_docker
      with:
        images: |
          ov_build/ubuntu_22_04_x64
        registry: openvinogithubactions.azurecr.io
        dockerfiles_root_dir: .github/dockerfiles
        changed_components: ${{ needs.smart_ci.outputs.changed_components }}
  Build_Doc:
    needs:
    - Docker
    - Smart_CI
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    container:
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_22_04_x64 }}
      volumes:
      - /mount:/mount
      - /home/runner/secrets/:/secrets:ro
      options: -e SCCACHE_AZURE_BLOB_CONTAINER -v ${{ github.workspace }}:${{ github.workspace }}
    env:
      OPENVINO_REPO: ${{ github.workspace }}/openvino
      BUILD_DIR: ${{ github.workspace }}/build
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: 1
      SCCACHE_SERVER_PORT: 35555
      SCCACHE_CACHE_SIZE: 50G
      SCCACHE_AZURE_KEY_PREFIX: build_docs
    steps:
    - name: Append the environment variable - load SCCACHE_AZURE_CONNECTION_STRING from file
      shell: bash
      run: |-
        if [ -f /secrets/sccache/connection-string ]; then
          SCCACHE_AZURE_CONNECTION_STRING="$(cat /secrets/sccache/connection-string)"
          echo "::add-mask::${SCCACHE_AZURE_CONNECTION_STRING}"
          echo "SCCACHE_AZURE_CONNECTION_STRING=${SCCACHE_AZURE_CONNECTION_STRING}" >> "$GITHUB_ENV"
          echo "✓ Connection string loaded and masked"
        else
          echo "GERALT_DBG: /secrets/sccache/connection-string not present (hosted/fork env); skipping secret load"
        fi
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: Build_Doc about to resolve the attacker-controlled PR ref for checkout"
        printf '%s\n' "GERALT_DBG GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
        printf '%s\n' "GERALT_DBG GITHUB_REF=$GITHUB_REF"
        printf '%s\n' "GERALT_DBG GITHUB_SHA=$GITHUB_SHA"
        printf '%s\n' "GERALT_DBG GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
        printf '%s\n' "GERALT_DBG GITHUB_BASE_REF=$GITHUB_BASE_REF"
        printf '%s\n' "GERALT_DBG OPENVINO_REPO=$OPENVINO_REPO"
      continue-on-error: true
    - name: Clone OpenVINO
      uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b
      timeout-minutes: 15
      with:
        path: ${{ env.OPENVINO_REPO }}
        submodules: 'true'
        lfs: 'true'
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: inspecting the PR-controlled tree that is about to be executed (pip install)"
        printf '%s\n' "GERALT_DBG OPENVINO_REPO=$OPENVINO_REPO"
        if [ -d "$OPENVINO_REPO" ]; then
          ls -la "$OPENVINO_REPO" 2>/dev/null | head -n 40 || echo "GERALT_DBG: ls of OPENVINO_REPO failed"
        else
          echo "GERALT_DBG: OPENVINO_REPO directory not present"
        fi
        printf '%s\n' "GERALT_DBG --- docs/requirements.txt ---"
        head -n 20 "$OPENVINO_REPO/docs/requirements.txt" 2>/dev/null || echo "GERALT_DBG: no docs/requirements.txt"
        printf '%s\n' "GERALT_DBG --- docs/openvino_sphinx_theme/setup.py ---"
        head -n 60 "$OPENVINO_REPO/docs/openvino_sphinx_theme/setup.py" 2>/dev/null || echo "GERALT_DBG: no setup.py"
      continue-on-error: true
    - name: Install python dependencies
      run: |
        python3 -m pip install -r ${OPENVINO_REPO}/docs/requirements.txt
        (cd ${OPENVINO_REPO}/docs/openvino_sphinx_theme && python3 -m pip install .)
        python3 -m pip install ${OPENVINO_REPO}/docs/openvino_custom_sphinx_sitemap
    - name: Validate benchmarks files
      run: python3 ${OPENVINO_REPO}/docs/scripts/tests/validate_benchmarks.py ${OPENVINO_REPO}/docs/sphinx_setup/_static/benchmarks_files/
    - name: Build docs
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_DOCS=ON -S ${OPENVINO_REPO} -B ${BUILD_DIR}
        cmake --build ${BUILD_DIR} --target sphinx_docs
    - name: Run Pytest
      run: |
        pytest --sphinx="${BUILD_DIR}/docs/sphinx.log" \
               --suppress-warnings="${OPENVINO_REPO}/docs/scripts/tests/suppress_warnings.txt" \
               --confcutdir="${OPENVINO_REPO}/docs/scripts/tests/" \
               --html="${OPENVINO_REPO}/build/docs/_artifacts/doc-generation.html" \
               --sphinx-strip="${BUILD_DIR}/docs/sphinx_source" \
               --xfail="${OPENVINO_REPO}/docs/scripts/tests/xfail.txt" \
               --self-contained-html ${OPENVINO_REPO}/docs/scripts/tests/test_docs.py
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  merge_group: null
